# Continuum Agent Operations read-only observation.
# Uses the existing GitHub Actions scheduler. No new hosted service.
# Does not add packages at repo root (package.json locked). Node builtins only.
# Does not apply schema. Does not commit. No em dashes or en dashes.

name: agent-ops-observe

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run read-only observation
        env:
          CONTINUUM_OBSERVE_BASE: https://www.continuumrtw.com
        run: node internal/agent-ops/observe.mjs
