<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="/">
<title>Continuum hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="/supabase.js"></script>
<script src="/store.js"></script>
<script src="/hub/roles.js"></script>
<style>
  :root{--navy:#0E1B2C;--navy2:#0A1526;--card:#14243B;--gold:#C8972F;--gold2:#E3B968;--ink:#16202E;--slate:#5E6B7C;--mist:#AAB6C6;--hair:rgba(255,255,255,.08);--panel:#F7F7F5}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--navy2);font-family:'Inter',sans-serif;color:#fff}
  a{color:var(--gold);text-decoration:none}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:20px}
  .cmark{width:34px;height:34px;border-radius:9px;background:var(--card);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px}
  .wordmark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px}
  .kick{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-.02em}
  .loginbox{width:360px;max-width:100%;background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:26px}
  input.txt{width:100%;min-height:46px;border:1px solid var(--hair);border-radius:11px;background:#0E1B2C;color:#fff;padding:0 13px;font-family:inherit;font-size:14px;margin-top:10px}
  .btn{display:block;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--gold);color:var(--navy);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--gold2)}
  .btn.sm{min-height:44px;font-size:13px;width:auto;padding:0 16px}
  .btn.ghost{background:transparent;border:1px solid var(--hair);color:#fff}
  .presenter{width:360px;max-width:100%;margin-top:16px;border:1px dashed rgba(200,151,47,.4);border-radius:12px;padding:14px}
  .presenter .kick{color:var(--gold2)}
  .presenter .prow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .errbox{background:rgba(200,60,60,.14);border:1px solid rgba(200,60,60,.35);border-radius:10px;padding:9px 12px;font-size:12.5px;color:#f3b9b9;margin-top:8px;display:none}
  .errbox.on{display:block}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:520px;max-width:100%}
  .role{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:20px;cursor:pointer;text-align:left;transition:transform 200ms ease,border-color 200ms ease,box-shadow 200ms ease;animation:roleIn 280ms ease backwards}
  .role:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 18px rgba(14,27,44,.35)}
  .role:active{transform:scale(.98)}
  /* Entrance stagger: worker card lands first and emphasized, the rest assemble after it */
  .role:nth-child(1){animation-delay:0ms}
  .role:nth-child(2){animation-delay:60ms}
  .role:nth-child(3){animation-delay:120ms}
  .role:nth-child(4){animation-delay:180ms}
  .role:nth-child(5){animation-delay:240ms}
  .role:nth-child(6){animation-delay:300ms}
  @keyframes roleIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){
    .role{transition:none;animation:none}
    .role:hover{transform:none}
    .role:active{transform:none}
  }
  .role-worker{font-family:inherit;color:#fff;width:100%}
  .role h3{font-family:'Space Grotesk',sans-serif;margin:0 0 4px;font-size:17px}
  .role p{color:var(--mist);font-size:12.5px;margin:0;line-height:1.5}
  .top{position:sticky;top:0;z-index:5;background:var(--navy);border-bottom:1px solid var(--hair);padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 22px 60px}
  .panel{background:var(--panel);color:var(--ink);border-radius:14px;padding:18px;margin-bottom:16px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .kpi{background:#fff;border:1px solid rgba(22,32,46,.08);border-radius:11px;padding:12px}
  .kpi .n{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--ink)}
  .kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:600;margin-top:2px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:11px;overflow:hidden}
  th,td{text-align:left;padding:11px 12px;font-size:13px;border-bottom:1px solid rgba(22,32,46,.07)}
  th{background:#F0EFEC;color:var(--slate);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
  .p-light{background:rgba(200,151,47,.16);color:#8a6a22}.p-off{background:rgba(94,107,124,.16);color:#4b5563}
  .p-pending{background:rgba(60,120,90,.14);color:#2f6a4a}.p-signed{background:rgba(60,120,90,.2);color:#245b3d}.p-esc{background:rgba(200,120,40,.18);color:#a8621f}
  .prog{height:6px;border-radius:6px;background:#EEE9DF;position:relative;width:90px}.prog span{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:var(--gold)}
  h2.sec{font-family:'Space Grotesk',sans-serif;font-size:18px;color:var(--ink);margin:0 0 12px}
  .note{font-size:12px;color:var(--slate)}
  .alert{background:rgba(200,120,40,.12);border:1px solid rgba(200,120,40,.35);border-radius:11px;padding:13px 14px;color:#8a4f1a;margin-bottom:12px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{min-height:44px;padding:0 14px;border:1px solid rgba(22,32,46,.15);background:#fff;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .chip.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
  .doc{background:#fff;border:1px solid rgba(22,32,46,.1);border-radius:11px;padding:16px;color:var(--ink)}
  .doc h4{font-family:'Space Grotesk',sans-serif;margin:0 0 8px}
  button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div id="hub"></div>
<script>
(function(){
  var ROLES={hse:'HSE',employer:'Employer',clinic:'Clinical Partner',wcb:'WCB'};
  var session={authenticated:false,group:null,isAdmin:false};

  function view(){ return (location.hash||'#login').replace('#',''); }

  function render(){
    var v=view(), host=document.getElementById('hub');
    if(v==='login') return host.innerHTML=loginView();
    if(v==='signup') return host.innerHTML=signupView();
    if(v==='awaiting') return host.innerHTML=awaitingView();
    if(v==='roles'){
      if(!session.authenticated){ location.hash='#login'; return; }
      if(window.ContinuumRolesView&&window.ContinuumRolesView.mount){
        host.innerHTML='';
        window.ContinuumRolesView.mount(host, { isAdmin: session.isAdmin });
        return;
      }
      return host.innerHTML=rolesView(session.isAdmin); /* graceful fallback if the bundle fails to load */
    }
    if(v==='employer'){ location.href='/employer-dashboard.html'; return; }
    if(v==='wcb'){ location.href='/wcb-portal.html'; return; }
    if(v==='hse'){ location.href='/hse-portal.html'; return; }
    if(v==='clinic'){ location.href='/clinical-dashboard.html'; return; }
    if(v==='admin'){ location.href='/admin-portal.html'; return; }
    if(!ROLES[v]) { location.hash='#login'; return; }
  }

  function brand(){
    return '<div class="brand"><img src="/continuum-logo.svg" alt="Continuum Return to Work" style="height:64px;width:auto;display:block;margin:0 auto"></div>';
  }

  function loginView(){
    return '<div class="center"><div>'+brand()+
      '<div class="loginbox"><div class="kick">Continuum Hub</div><h1 style="font-size:20px;margin:8px 0 4px">Sign in</h1>'+
      '<p class="note" style="color:var(--mist)">Dashboard access for HSE, employer, Clinical Partner, and WCB.</p>'+
      '<div class="errbox" id="loginErr"></div>'+
      '<input class="txt" id="loginEmail" type="email" placeholder="Work email" autocomplete="username">'+
      '<input class="txt" id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">'+
      '<button class="btn" id="loginBtn" data-action="signin" style="margin-top:12px">Sign in</button>'+
      '<p class="note" style="font-size:12px;color:var(--mist);text-align:center;margin-top:12px">By continuing you agree to the <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a>.</p>'+
      '<p class="note" style="color:var(--mist);margin-top:12px">New here? <a href="#signup" data-hashlink="signup">Create an account</a>.</p>'+
      '<p class="note" style="color:var(--mist);margin-top:6px">Workers use the <a href="/app">worker app</a> with an SMS code.</p></div>'+
      '</div></div>';
  }

  function signupView(){
    return '<div class="center"><div>'+brand()+
      '<div class="loginbox"><div class="kick">Continuum Hub</div><h1 style="font-size:20px;margin:8px 0 4px">Create an account</h1>'+
      '<p class="note" style="color:var(--mist)">Your account is reviewed before it can reach a dashboard.</p>'+
      '<div class="errbox" id="signupErr"></div>'+
      '<input class="txt" id="signupEmail" type="email" placeholder="Work email" autocomplete="username">'+
      '<input class="txt" id="signupPassword" type="password" placeholder="Password (8+ characters)" autocomplete="new-password">'+
      '<button class="btn" id="signupBtn" data-action="signup" style="margin-top:12px">Create account</button>'+
      '<p class="note" style="color:var(--mist);margin-top:12px">Already have an account? <a href="#login" data-hashlink="login">Sign in</a>.</p>'+
      '</div></div></div>';
  }

  function awaitingView(){
    return '<div class="center"><div>'+brand()+
      '<div class="loginbox"><div class="kick">Continuum Hub</div><h1 style="font-size:20px;margin:8px 0 4px">Awaiting approval</h1>'+
      '<p class="note" style="color:var(--mist)">Your account is awaiting approval. Check back once an administrator has reviewed it.</p>'+
      '<button class="btn ghost" data-action="backtologin" style="margin-top:12px">Back to sign in</button>'+
      '</div></div></div>';
  }

  function rolesView(isAdmin){
    var worker='<button type="button" class="role role-worker" data-nav="/worker-dashboard.html"><h3>Worker</h3><p>Your space for recovery. Do a quick check-in, see your duties for today, and follow your plan. Open it to start.</p></button>';
    var employer='<button type="button" class="role" data-nav="/employer-dashboard.html"><h3>Employer</h3><p>Employer dashboard. Functional status only, never medical detail.</p></button>';
    var wcb='<button type="button" class="role" data-nav="/wcb-portal.html"><h3>WCB</h3><p>Compensation board portal. Read only claims and milestone notifications.</p></button>';
    var hse='<button type="button" class="role" data-nav="/hse-portal.html"><h3>HSE</h3><p>Light duties workspace. Assign tasks within restrictions. Recovery scores visible.</p></button>';
    var clinic='<button type="button" class="role" data-nav="/clinical-dashboard.html"><h3>Clinical Partner</h3><p>Clinical control center. Full detail, sign-off, escalation.</p></button>';
    var admin=isAdmin?'<button type="button" class="role" data-nav="/admin-portal.html"><h3>Platform Admin</h3><p>Continuum internal. Tenants, users, access grants, and billing.</p></button>':'';
    var sigma='<button type="button" class="role" data-nav="/sigma-portal.html"><h3>SIGMA Exchange</h3><p>The system-of-record connection. A proposed workflow, not a live integration.</p></button>';
    return '<div class="center"><div>'+brand()+
      '<div class="roles">'+worker+hse+employer+clinic+wcb+admin+sigma+'</div>'+
      '</div></div>';
  }

  async function postJson(url, body){
    var res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var data=null;
    try { data=await res.json(); } catch(e) { data=null; }
    return { status:res.status, ok:res.ok, data:data };
  }

  async function checkSession(){
    try {
      var res=await fetch('/api/hub-whoami');
      var data=await res.json();
      if(res.ok&&data&&data.ok){
        session={authenticated:true,group:data.group,isAdmin:data.group==='admin'};
      } else {
        session={authenticated:false,group:null,isAdmin:false};
      }
    } catch(e) {
      session={authenticated:false,group:null,isAdmin:false};
    }
  }

  function showErr(id,msg){
    var el=document.getElementById(id);
    if(!el) return;
    el.textContent=msg;
    el.classList.add('on');
  }
  function clearErr(id){
    var el=document.getElementById(id);
    if(!el) return;
    el.textContent='';
    el.classList.remove('on');
  }

  async function doSignin(){
    clearErr('loginErr');
    var email=document.getElementById('loginEmail').value.trim();
    var password=document.getElementById('loginPassword').value;
    var result=await postJson('/api/hub-signin',{email:email,password:password});
    if(result.ok&&result.data&&result.data.ok){
      if(result.data.group){ await checkSession(); location.hash='#roles'; return; }
      if(result.data.status==='pending'){ location.hash='#awaiting'; return; }
    }
    var msg=(result.data&&(result.data.error||(result.data.errors&&result.data.errors[0])))||'Sign in failed.';
    showErr('loginErr',msg);
  }

  async function doSignup(){
    clearErr('signupErr');
    var email=document.getElementById('signupEmail').value.trim();
    var password=document.getElementById('signupPassword').value;
    var result=await postJson('/api/hub-signup',{email:email,password:password});
    if(result.ok&&result.data&&result.data.ok){ location.hash='#awaiting'; return; }
    var msg=(result.data&&result.data.errors&&result.data.errors[0])||'Could not create account.';
    showErr('signupErr',msg);
  }

  document.addEventListener('click', function(ev){
    var t=ev.target.closest('[data-action],[data-role],[data-nav],[data-hashlink]'); if(!t) return;
    if(t.hasAttribute('data-hashlink')){ location.hash='#'+t.getAttribute('data-hashlink'); return; }
    if(t.hasAttribute('data-nav')){ location.href=t.getAttribute('data-nav'); return; }
    if(t.hasAttribute('data-role')){ location.hash='#'+t.getAttribute('data-role'); return; }
    var a=t.getAttribute('data-action');
    if(a==='signin') doSignin();
    else if(a==='signup') doSignup();
    else if(a==='backtologin') location.hash='#login';
  });

  window.addEventListener('hashchange', render);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ checkSession().then(render); } });
  (async function init(){
    await checkSession();
    if(session.authenticated && (view()==='login'||!location.hash)) location.hash='#roles';
    render();
  })();
})();
</script>
</body>
</html>
