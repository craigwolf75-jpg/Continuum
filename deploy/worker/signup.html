<!DOCTYPE html>
<html lang="en" data-theme="light" data-density="comfortable" data-surface="worker">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Continuum: sign up</title>
<link rel="stylesheet" href="/continuum-vars.css">
<style>
:root{--font-ui:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--r:12px;--target:52px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-ui);background:var(--ink-050);color:var(--ink-700);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;font-size:112.5%}
.card{background:var(--white);border:1px solid var(--ink-200);border-radius:16px;width:100%;max-width:420px;padding:28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--ink-900);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:8px;top:16px;width:18px;height:2px;background:var(--white);border-radius:2px;box-shadow:0 6px 0 rgba(255,255,255,.45),0 -6px 0 rgba(255,255,255,.45)}
.brand b{font-size:1.15rem;color:var(--ink-900)}
h1{font-size:1.3rem;margin:0 0 4px;color:var(--ink-900)}p.sub{margin:0 0 20px;font-size:.9rem;color:var(--ink-500)}
label{display:block;font-size:.9rem;font-weight:600;color:var(--ink-900);margin:0 0 8px}
input{width:100%;min-height:var(--target);padding:0 14px;font:inherit;font-size:1rem;border:1px solid var(--ink-400);border-radius:var(--r);margin-bottom:16px;color:var(--ink-900)}
input:focus{outline:2px solid var(--action-600);outline-offset:2px}
button{width:100%;min-height:var(--target);border:1px solid var(--action-600);background:var(--action-600);color:var(--white);font:inherit;font-weight:600;border-radius:var(--r);cursor:pointer}
button:hover:not(:disabled){background:var(--action-700)}button:disabled{opacity:.6}
.err{display:none;margin:0 0 16px;font-size:.9rem;color:var(--stop-700);background:var(--stop-050);border:1px solid var(--stop-700);border-radius:8px;padding:12px}
.err.show{display:block}
.ok{display:none;margin:0 0 16px;font-size:.9rem;color:var(--ink-700);background:var(--ink-050);border:1px solid var(--ink-200);border-radius:8px;padding:12px}
.ok.show{display:block}
.alt{margin-top:18px;font-size:.9rem;color:var(--ink-500);text-align:center}
.alt a{color:var(--action-700);font-weight:600}
.foot{margin-top:18px;font-size:.78rem;color:var(--ink-500);line-height:1.5}
</style>
</head>
<body>
<form class="card" id="signupForm">
  <div class="brand"><span class="mark" aria-hidden="true"></span><b>Continuum</b></div>
  <h1>Sign up</h1>
  <p class="sub">Your recovery companion.</p>
  <div class="err" id="err" role="alert"></div>
  <div class="ok" id="ok" role="status"></div>
  <label for="email">Email</label>
  <input type="email" id="email" autocomplete="username" required>
  <label for="password">Password</label>
  <input type="password" id="password" autocomplete="new-password" required minlength="8">
  <button type="submit" id="btn">Create an account</button>
  <p class="alt">Already have an account? <a href="login.html">Sign in</a>.</p>
  <p class="foot">The doctor decides. Continuum shows the information. What you type here never changes your medical record.</p>
</form>
<script src="app/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app/app.js"></script>
<script>
(function(){
  var form=document.getElementById("signupForm"), btn=document.getElementById("btn");
  var err=document.getElementById("err"), ok=document.getElementById("ok");
  var FAIL="That did not go through. Please try again, or email info@continuumrtw.com.";
  function showErr(text){ ok.classList.remove("show"); err.textContent=text; err.classList.add("show"); }
  function showOk(text){ err.classList.remove("show"); ok.textContent=text; ok.classList.add("show"); }
  WK.session().then(function(s){ if(s) location.href="today.html"; });
  form.addEventListener("submit", function(e){
    e.preventDefault(); err.classList.remove("show"); ok.classList.remove("show");
    btn.disabled=true; btn.textContent="Creating account...";
    var email=document.getElementById("email").value.trim();
    var password=document.getElementById("password").value;
    WK.signUp(email, password)
      .then(function(r){
        if(r && r.error) throw r.error;
        if(r && r.data && r.data.session){ location.href="first-run.html"; return; }
        showOk("Account created. Sign in to continue.");
        btn.disabled=false; btn.textContent="Create an account";
      })
      .catch(function(e2){
        showErr((e2 && e2.message) || FAIL);
        btn.disabled=false; btn.textContent="Create an account";
      });
  });
})();
</script>
</body>
</html>
